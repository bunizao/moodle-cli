name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.5.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/moodle-cli
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          node - <<'JS'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const tag = process.env.RELEASE_TAG;
          const expected = `v${pkg.version}`;
          if (pkg.name !== "moodle-cli") {
            throw new Error(`Refusing to release unexpected package name: ${pkg.name}`);
          }
          if (tag !== expected) {
            throw new Error(`Tag ${tag} does not match package version ${expected}`);
          }
          console.log(`Validated release tag ${tag} for ${pkg.name}`);
          JS

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Bundle npm package
        run: npm run build

      - name: Check npm package contents
        run: npm run pack:check

      - name: Smoke test packed CLI
        run: npm run pack:smoke

      - name: Check skill bundle drift
        run: |
          npm run skill:generate
          git diff --exit-code -- SKILL.md references agents/openai.yaml

      - name: Check npm publication state
        id: npm
        run: |
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if npm view "moodle-cli@${package_version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "moodle-cli@${package_version} is already published; skipping npm publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use npm with trusted publishing support
        if: steps.npm.outputs.published != 'true'
        run: npm install -g npm@11.17.0

      - name: Publish to npm
        if: steps.npm.outputs.published != 'true'
        run: |
          publish_tag="$(node -p "const version = require('./package.json').version; version.includes('-') ? version.split('-')[1].split('.')[0] : 'latest'")"
          npm publish --access public --tag "${publish_tag}"

      - name: Build standalone binaries
        run: |
          mkdir -p dist/bin
          bun build ./src/cli.ts --compile --target=bun-darwin-arm64 --outfile dist/bin/moodle-darwin-arm64
          bun build ./src/cli.ts --compile --target=bun-linux-x64 --outfile dist/bin/moodle-linux-x64
          chmod +x dist/bin/moodle-*

      - name: Resolve release notes file
        id: notes
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version_tag="${RELEASE_TAG#v}"
          notes_file=".github/release-notes/${version_tag}.md"
          if [ -f "${notes_file}" ]; then
            echo "has_manual_notes=true" >> "$GITHUB_OUTPUT"
            echo "notes_file=${notes_file}" >> "$GITHUB_OUTPUT"
          else
            echo "has_manual_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release with manual notes
        if: steps.notes.outputs.has_manual_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: |
            dist/bin/moodle-darwin-arm64
            dist/bin/moodle-linux-x64

      - name: Publish GitHub release with generated notes
        if: steps.notes.outputs.has_manual_notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/bin/moodle-darwin-arm64
            dist/bin/moodle-linux-x64
