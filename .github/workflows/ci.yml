name: CI

on:
  push:
    branches: ["**"]
    # Prose nobody installs. README, ONBOARDING, SKILL and references still run CI: they
    # ship in the package and the build checks their vocabulary and skill drift.
    paths-ignore:
      - "docs/**"
      - ".github/release-notes/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/assets/**"
      - ".github/pull_request_template.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".github/release-notes/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/assets/**"
      - ".github/pull_request_template.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "LICENSE"
  workflow_call:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Test real Worker runtime
        if: matrix.node-version == 22
        run: npm run test:worker:runtime

      - name: Install browser for OAuth regression
        if: matrix.node-version == 22
        run: npx playwright install --with-deps chromium

      - name: Test browser OAuth consent
        if: matrix.node-version == 22
        run: npm run test:worker:browser

      - name: Audit dependencies
        if: matrix.node-version == 22
        run: npm audit --audit-level=low

      - name: Check npm package contents
        run: npm run pack:check

      - name: Smoke test packed CLI
        run: npm run pack:smoke

      - name: Check skill bundle drift
        run: |
          npm run skill:generate
          git diff --exit-code -- skills .claude-plugin

  bun:
    name: Bun latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bunx vitest run

      - name: Build
        run: bun run build

      - name: Smoke test standalone binary
        run: bun run bin:smoke

      - name: Check npm package contents
        run: bun run pack:check

      - name: Smoke test packed CLI
        run: bun run pack:smoke

      - name: Check skill bundle drift
        run: |
          bun run skill:generate
          git diff --exit-code -- skills .claude-plugin

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npx vitest run --reporter=default --reporter=json --outputFile.json=vitest-windows.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-windows
          path: vitest-windows.json

      - name: Build
        if: always()
        run: npm run build

      - name: Smoke test packed CLI
        if: always()
        shell: bash
        env:
          npm_config_script_shell: bash
        run: npm run pack:smoke
