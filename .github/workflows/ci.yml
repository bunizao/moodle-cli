name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check npm package contents
        run: npm run pack:check

      - name: Smoke test packed CLI
        run: npm run pack:smoke

      - name: Check skill bundle drift
        run: |
          npm run skill:generate
          git diff --exit-code -- SKILL.md references agents/openai.yaml

  bun:
    name: Bun latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bunx vitest run

      - name: Build
        run: bun run build

      - name: Check npm package contents
        run: bun run pack:check

      - name: Smoke test packed CLI
        run: bun run pack:smoke

      - name: Check skill bundle drift
        run: |
          bun run skill:generate
          git diff --exit-code -- SKILL.md references agents/openai.yaml
